---
- name: "IaC - Deploiement des backends cyberlab (sherlock / dns_analyzer / audit_orchestrator + cloudflared)"
  hosts: localhost
  connection: local
  vars:
    cyberlab_project_dir: "/volume2/docker/cyberlab"
    repo_root: "{{ playbook_dir }}/../.."
    cosign_image: "gcr.io/projectsigstore/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8"
    # Source de verite unique : le docker-compose.yml. Les images a verifier
    # (celles publiees sur GHCR par les CI des backends) sont lues dedans, il
    # n'y a plus aucun digest a maintenir dans ce playbook.
    compose: "{{ lookup('ansible.builtin.file', repo_root ~ '/cyberlab/docker-compose.yml') | from_yaml }}"
    signed_images: "{{ compose.services.values() | map(attribute='image') | select('match', '^ghcr\\.io/') | list }}"
    # Images cloudflared (tag:version@digest) : pas de signature a verifier,
    # mais meme affichage "<none>" a corriger (voir la tache de tag en fin de play).
    cloudflared_images: "{{ compose.services.values() | map(attribute='image') | select('match', '^cloudflare/cloudflared[:@]') | unique | list }}"

  tasks:
    # Gate : on ne deploie que des images signees par le workflow ci.yml de la
    # branche main du depot correspondant (owner/repo deduits du nom d'image ;
    # (?i) car le certificat garde la casse du compte, GHCR force les minuscules).
    # Si une verification echoue, rien n'est copie ni deploye.
    - name: "Verification de la signature Cosign des images backends"
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - "{{ cosign_image }}"
          - verify
          - --certificate-identity-regexp
          - "(?i)^https://github.com/{{ item.split('@')[0].split('/')[1:] | join('/') }}/\\.github/workflows/ci\\.yml@refs/heads/main$"
          - --certificate-oidc-issuer
          - "https://token.actions.githubusercontent.com"
          - "{{ item }}"
      loop: "{{ signed_images }}"
      changed_when: false

    # Les .env (secrets) sont deja sur le NAS, hors git, dans les sous-dossiers
    # de ce repertoire. Les images backends sont epinglees par digest : un
    # nouveau digest n'etant pas present, pull: missing le tire.
    # remove_orphans: false par prudence.
    - name: "Deploiement du compose cyberlab"
      ansible.builtin.copy:
        src: "{{ repo_root }}/cyberlab/docker-compose.yml"
        dest: "{{ cyberlab_project_dir }}/docker-compose.yml"
        mode: '0644'

    # Ce compose cree le reseau "cyberlab" (nom fixe) que la stack monitoring
    # declare en external : le premier deploiement du monitoring exige donc que
    # ce playbook ait deja tourne une fois.
    - name: "Gestion de la stack Docker Compose cyberlab"
      community.docker.docker_compose_v2:
        project_src: "{{ cyberlab_project_dir }}"
        project_name: "cyberlab"
        state: present
        pull: missing
        remove_orphans: false
      environment:
        DOCKER_API_VERSION: "1.43"

    # Cosmetique : une image tiree par digest n'a aucun tag local, Portainer
    # l'affiche "<none>". On pose un tag fixe "deployed" sur le digest en
    # service. Le compose reste epingle par digest (verification Cosign et
    # deploiement inchanges) ; ce tag n'est jamais utilise pour tirer l'image.
    - name: "Tag local 'deployed' sur les images backends (lisibilite Portainer)"
      ansible.builtin.command:
        argv:
          - docker
          - tag
          - "{{ item }}"
          - "{{ item.split('@')[0] }}:deployed"
      loop: "{{ signed_images }}"
      changed_when: false
      environment:
        DOCKER_API_VERSION: "1.43"

    # Meme cosmetique pour cloudflared : on rejoue le tag de version du compose
    # (ex. cloudflare/cloudflared:2026.9.3) sur le digest en service, pour que
    # Portainer/Synology affichent la version au lieu de "<none>". Le tag est
    # toujours derive du compose, donc suivi par Renovate sans maintenance ici.
    - name: "Tag local de version sur les images cloudflared (lisibilite Portainer)"
      ansible.builtin.command:
        argv:
          - docker
          - tag
          - "{{ item }}"
          - "{{ item.split('@')[0] }}"
      loop: "{{ cloudflared_images }}"
      changed_when: false
      environment:
        DOCKER_API_VERSION: "1.43"
