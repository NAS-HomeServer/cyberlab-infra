apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cyberlab-staging
resources:
  - namespace.yaml
  - ../../base
# Secrets : ajoutes avec SOPS (PR dediee). Staging a ses propres tunnels.
images:
  - name: ghcr.io/ag69075/cyberlab_sherlock_backend
    digest: sha256:93f145cd77d0be2f23201c9720c8e4cd8d3afa4940cc676d17716e22d3240a06
  - name: ghcr.io/ag69075/cyberlab_dns-analyzer
    digest: sha256:104d2f8a2a383d31231123a802be6108a5c532c0eb7e4b8ff21f089a0eb60cc9
  - name: ghcr.io/ag69075/cyberlab_audit_orchestrator
    digest: sha256:4700e4f1917e5e6bdcc5fbe400649a123f41fce0c286e2812988c6941863eb81
# Staging cohabite avec la production sur la meme petite instance : limites reduites.
patches:
  - target: {kind: Deployment, name: sherlock}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 384Mi}
  - target: {kind: Deployment, name: "dns-analyzer|audit-orchestrator"}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 256Mi}
