apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-orchestrator
  labels:
    app.kubernetes.io/name: audit-orchestrator
    app.kubernetes.io/part-of: cyberlab
    app.kubernetes.io/component: backend
spec:
  # 1 seul replica : les jobs sont gardes en memoire du process (aucune donnee
  # durable), un suivi de job doit retomber sur le meme pod.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-orchestrator
        app.kubernetes.io/part-of: cyberlab
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-orchestrator
          image: ghcr.io/ag69075/cyberlab_audit_orchestrator
          ports:
            - name: http
              containerPort: 4003
          envFrom:
            - secretRef:
                name: audit-orchestrator-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # Equivalent du HEALTHCHECK Dockerfile (toutes les 30 s, start-period 15 s).
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Equivalent de tmpfs /tmp:rw,noexec,nosuid,size=64m (compte dans la limite memoire).
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audit-orchestrator
  labels:
    app.kubernetes.io/name: audit-orchestrator
    app.kubernetes.io/part-of: cyberlab
spec:
  selector:
    app.kubernetes.io/name: audit-orchestrator
  ports:
    - name: http
      port: 4003
      targetPort: http
