apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-audit
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared-audit
    app.kubernetes.io/part-of: cyberlab
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: cloudflared-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: cloudflared-audit
        app.kubernetes.io/part-of: cyberlab
        app.kubernetes.io/component: tunnel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
          # --metrics expose /metrics (Prometheus) et /ready (200 si le tunnel est connecte).
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-audit
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          # Tunnel deconnecte plus de ~3 min : redemarrage du pod.
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
