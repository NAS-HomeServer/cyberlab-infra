# Test local : l'agent ecrit vers un faux NAS (Prometheus avec recepteur remote_write).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: kind
scrape_config_files:
  - /etc/prometheus/scrape/scrape.yml
remote_write:
  - url: http://fake-nas.nas-sim.svc.cluster.local:9090/api/v1/write
    queue_config:
      capacity: 2500
      max_shards: 2
      max_samples_per_send: 500
